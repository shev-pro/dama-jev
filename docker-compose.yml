services:
  dama:
    build: .
    image: dama-jev
    container_name: dama-jev
    # Bound to loopback on purpose: the server forwards the player's API key,
    # and there is no reason for it to be reachable from the local network.
    # Exposing it for real also means adding that host name to ALLOWED_HOSTS.
    ports:
      - "127.0.0.1:5173:5173"
    restart: unless-stopped

    # Behind a TLS-inspecting corporate proxy (Zscaler, Cato, Netskope and so on)
    # the container does not trust the CA it is shown in place of TypeSafe's, and
    # every call fails with SELF_SIGNED_CERT_IN_CHAIN. The fix is to give it the
    # corporate CA, not to switch verification off. See the README.
    # volumes:
    #   - ./certs:/certs:ro
    # environment:
    #   NODE_EXTRA_CA_CERTS: /certs/corporate-ca.pem
